<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Contractor Handoff</title><link rel="stylesheet" href="/assets/css/portal.css?v=ic-20261013"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js?v=ic-20261013"></script></head><body class="login-page"><main class="login-card"><h1>Connecting securely</h1><p id="status">Opening your contractor workspace…</p><a href="https://portal.screenings4u.com/selector.html">Return to selector</a></main><script>(async()=>{const msg=document.getElementById('status'),C=window.PORTAL_CONFIG,code=new URLSearchParams(location.search).get('code');history.replaceState(null,'','/auth-handoff.html');try{if(!code||!/^[0-9a-f]{64}$/i.test(code))throw Error('Invalid handoff code');const r=await fetch(C.workforceUrl+'/functions/v1/portal-session-handoff',{method:'POST',headers:{apikey:C.workforceKey,'content-type':'application/json'},body:JSON.stringify({action:'redeem',code})});const d=await r.json();if(!r.ok||!d.token_hash||d.target_surface!=='dot'||!['independent_contractor','ctpa_contractor_dot','direct_contractor_dot'].includes(d.target_portal))throw Error(d.error||'Invalid contractor handoff');const sb=window.S4UGetSupabaseClient(),v=await sb.auth.verifyOtp({token_hash:d.token_hash,type:'magiclink'});if(v.error||!v.data?.session)throw Error('Session verification failed');location.replace('/dashboard.html')}catch(e){msg.textContent=e.message||String(e)}})()</script></body></html>
