<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Independent Contractor Sign In | screenings4u</title><link rel="stylesheet" href="/assets/css/portal.css?v=ic-20261013"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js?v=ic-20261013"></script></head><body class="login-page"><main class="login-card"><h1>screenings4u Independent Contractor</h1><p>Sign in to your contractor account.</p><form id="loginForm"><div class="field"><label>Email<input name="email" type="email" autocomplete="email" required></label></div><div class="field"><label>Password<input name="password" type="password" autocomplete="current-password" required></label></div><button class="btn primary" type="submit">Sign In</button></form><p id="status" role="status"></p><a href="/forgot-password.html">Forgot password?</a></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.getElementById('status');s.textContent='Signing in…';const sb=window.S4UGetSupabaseClient(),{error}=await sb.auth.signInWithPassword({email:f.email.value,password:f.password.value});if(error){s.textContent=error.message;return}location.replace('/dashboard.html')});</script></body></html>
