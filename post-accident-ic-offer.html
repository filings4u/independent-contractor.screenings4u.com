<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-Accident Work Order Offer</title><style>body{margin:0;background:#edf2f8;font:16px Arial;color:#17365f}header{background:#102f55;padding:24px;border-bottom:4px solid #f97300}header img{width:200px}main{max-width:650px;background:white;margin:30px auto;padding:28px;border-radius:12px}button{padding:13px 23px;border:0;border-radius:7px;background:#153e75;color:white;margin:8px 10px 0 0;cursor:pointer}.outline{background:#64748b}#details{background:#f3f7fb;padding:18px;margin-top:20px;white-space:pre-wrap}</style></head><body><header><img src="https://elpbnytpciqnbexiaebp.supabase.co/storage/v1/object/public/enterprise_branding/workforce-dot2.png" alt="workforce | screenings4u"></header><main><h1>Post-Accident Work Order Offer</h1><div id="info">Checking your offer…</div><div id="actions" hidden><button id="accept">Approve Assignment</button><button class="outline" id="decline">Decline</button></div><div id="details" hidden></div></main><script>const endpoint='https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/workforce-post-accident-ic-orders',token=new URLSearchParams(location.search).get('token');async function api(action){const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}const info=document.getElementById('info'),actions=document.getElementById('actions'),details=document.getElementById('details');async function load(){try{const d=await api('get');info.textContent=d.title+' | '+d.city+', '+d.state+' | Offered compensation $'+Number(d.compensation).toFixed(2)+' | '+d.reference;if(d.status==='offered')actions.hidden=false;if(d.status==='accepted'){details.hidden=false;details.textContent='Assignment approved. Full work order details are sent to your registered IC email address.'}}catch(e){info.textContent=e.message}}for(const [button,action] of [['accept','approve'],['decline','decline']])document.getElementById(button).onclick=async()=>{actions.hidden=true;try{await api(action);await load()}catch(e){info.textContent=e.message}};load();</script></body></html>
